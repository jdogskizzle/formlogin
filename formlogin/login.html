<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · {{title}}</title>
{{icon}}
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
  --accent: {{accent}}; --accent-text: #fff; --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #8b93a1; --line: #272b35;
    --accent: {{accent_dark}}; --accent-text: #0f1115; --danger: #f2827a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: min(340px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input { font: inherit; font-size: 15px; padding: 9px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { font: inherit; font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 6px;
  background: var(--accent); color: var(--accent-text); border: 0; }
.err { color: var(--danger); font-size: 14px; margin: 0; }
.err:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>{{title}}</h1>
  <p class="err" role="alert">{{error}}</p>
  <label>Username<input name="username" value="{{user}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
